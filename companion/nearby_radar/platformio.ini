[env:esp32-reference]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DNR_UART_RX=16
    -DNR_UART_TX=17
    -Wall
; Reference ESP32 UART profile, NOT a verified AIO Board 1.4 pin map.
; Confirm the real board's chip and UART wiring before building a board profile or uploading.
